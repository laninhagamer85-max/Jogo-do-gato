<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Verificação de viewport — Meu Pet Virtual</title><style>body{margin:0;background:#101e2b;color:#edf9fa;font:14px system-ui}header{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:12px}h1{font-size:16px;margin:0}button{min-height:44px;padding:8px 16px;border:1px solid #72b6bc;border-radius:10px;background:#244b59;color:#fff;cursor:pointer}button[aria-pressed=true]{background:#34798c}main{overflow:auto;padding:8px 16px 16px;display:grid;justify-content:center}iframe{display:block;border:2px solid #79a6b3;border-radius:10px;max-width:none;flex:none;width:844px;height:390px;background:#102530}output{min-width:100px}</style></head><body><header><h1>Verificação de layout</h1><button id="landscape" aria-pressed="true">Celular horizontal 844 × 390</button><button id="portrait" aria-pressed="false">Celular vertical 390 × 844</button><output id="size">844 × 390</output></header><main><iframe id="game" title="Meu Pet Virtual — viewport de teste" src="/"></iframe></main><script>const game=document.getElementById('game'),size=document.getElementById('size');for(const id of ['landscape','portrait'])document.getElementById(id).onclick=()=>{const vertical=id==='portrait',width=vertical?390:844,height=vertical?844:390;game.style.width=width+'px';game.style.height=height+'px';size.textContent=width+' × '+height;for(const other of ['landscape','portrait'])document.getElementById(other).setAttribute('aria-pressed',String(other===id));};</script></body></html>
